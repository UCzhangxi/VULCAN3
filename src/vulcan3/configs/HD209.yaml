# VULCAN3 configuration (HD209). Overlays default.yaml: only the knobs that
# differ from it are set here; every other knob takes its default.yaml value.
# Authored surface: edit values here (or a CWD ./configs/HD209.yaml override).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).

# ====== Setting up paths and filenames for the input and output files ======
atm_file: atm/atm_HD209_Kzz.txt
sflux_file: atm/stellar_flux/Gueymard_solar.txt
vul_ini: output/HD209-noPhoto.vul
out_name: HD209.vul

# ====== Setting up the elemental abundance ======
use_solar: false

# ====== Setting up photochemistry ======
r_star: 1.203
Rp: 9865896000.0
orbit_radius: 0.04747
Mp: 1.3650331275836532e+30

# ====== Setting up the boundary conditions ======
diff_esc:
- H

# ====== Condensation ======
start_conden_time: 10000000000.0

# ====== Setting up numerical parameters for the ODE solver ======
count_max: 30000
